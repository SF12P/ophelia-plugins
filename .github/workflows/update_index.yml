name: Update Plugin Index

on:
  push:
    paths:
      - 'plugins/**.py'
  workflow_dispatch:  # Enables the "Run workflow" button on GitHub

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate index.json from plugin files
        run: python3 .github/scripts/build_index.py

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "Auto-update index.json"
          git push
